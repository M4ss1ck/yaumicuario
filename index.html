<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aquarium</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🐟</text></svg>" />
    <!-- Every fish texture is KTX2, so nothing renders textured until the Basis
         transcoder has arrived. Starting it with the document rather than when
         the first texture asks for it removes a serial hop on a slow link. -->
    <link rel="preload" href="./basis/basis_transcoder.js" as="script" />
    <link rel="preload" href="./basis/basis_transcoder.wasm" as="fetch" type="application/wasm" crossorigin />
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #04161c; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      #loading {
        position: fixed; inset: 0; display: grid; place-items: center;
        color: #cfe8ef;
        background: #04161c; transition: opacity 0.8s ease; z-index: 10;
      }
      #loading.hidden { opacity: 0; pointer-events: none; }
      #loading-lockup { width: min(1000px, calc(100vw - 40px)); text-align: center; }
      #loading-wordmark {
        width: 100%; height: auto;
      }
      #loading-progress {
        color: #82aab4; font: 300 13px/1.4 system-ui, sans-serif;
        letter-spacing: 0.12em; margin-top: 20px; text-transform: uppercase;
      }
      .cursor-hidden, .cursor-hidden * { cursor: none !important; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading" role="status">
      <div id="loading-lockup">
        <canvas id="loading-wordmark" role="img" aria-label="YAUMICUARIO">YAUMICUARIO</canvas>
        <div id="loading-progress">Loading aquarium…</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
